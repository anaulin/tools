[project]
name = "book-sync"
version = "0.1.0"
description = "Import reading history (Goodreads), Readwise clippings, and SF award lists into an Obsidian vault as the source of truth."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "python-frontmatter>=1.1",
    "rapidfuzz>=3.9",
]

[project.scripts]
book-sync = "book_sync.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_sync"]
