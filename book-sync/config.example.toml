# Copy to config.toml (gitignored) and adjust. The tool reads config.toml by default.

[vault]
path = "/Users/anaulin/vaults/notes"
books_dir = "Reference/books"
clippings_dir = "Reference/Clippings"

[clippings]
# Status assigned to a book note created from a clipping that has no Goodreads
# match (you highlighted it, so you presumably read it). Existing notes are
# never overwritten.
default_status = "read"

[awards]
# Status assigned to award-list books you don't yet have a note for (your
# "read next" pipeline).
default_status = "want"
# Path to the curated awards dataset, relative to this config file.
data_file = "data/awards.json"

[matching]
# rapidfuzz token_sort_ratio threshold (0-100) for the title+author fuzzy
# fallback, used only when there's no gr_id or ISBN match. Higher = stricter.
fuzzy_threshold = 88
