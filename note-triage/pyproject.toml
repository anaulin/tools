[project]
name = "note-triage"
version = "0.1.0"
description = "A TUI for triaging markdown notes (keep / trash)."
requires-python = ">=3.12"
dependencies = [
    "textual>=0.85",
    "send2trash>=1.8",
]

[project.scripts]
note-triage = "note_triage.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/note_triage"]
